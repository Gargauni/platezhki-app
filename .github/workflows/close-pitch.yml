name: Закрыть презентацию /pitch/

# 16.10.2026, 9:05 и 9:35 по Москве (06:05 и 06:35 UTC). Второй запуск — подстраховка, если GitHub задержит первый.
on:
  schedule:
    - cron: "5 6 16 10 *"
    - cron: "35 6 16 10 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Удалить /pitch/ и этот workflow
        run: |
          git config user.name "Gargauni"
          git config user.email "gargauni@gmail.com"
          [ -d pitch ] && git rm -rq pitch || true
          git rm -q .github/workflows/close-pitch.yml
          git commit -m "Презентация /pitch/ закрыта по расписанию" && git push
      - name: Пересобрать сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
